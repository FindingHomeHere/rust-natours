[package]
name = "natours"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "1.0.1", features = ["logging", "serve-static"] }
askama = "0.16.1"
tokio = { version = "1.53.2", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
diesel = { version = "2.3.14", features = ["postgres", "time", "r2d2"] }
time = "0.3.55"
